name: GlassX
options:
  bundleIdPrefix: com.ryanvogel
  deploymentTarget:
    macOS: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MACOSX_DEPLOYMENT_TARGET: "27.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
targets:
  GlassX:
    type: application
    platform: macOS
    sources:
      - path: GlassX
    entitlements:
      path: GlassX/GlassX.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
    info:
      path: GlassX/Info.plist
      properties:
        CFBundleDisplayName: GlassX
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.social-networking
        NSHumanReadableCopyright: "© 2026 Ryan Vogel"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ryanvogel.glassx
        PRODUCT_NAME: GlassX
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "19AE73C094F20EE9C3DE11B9E2CE129D5D197C32"
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: GlassX
        GENERATE_INFOPLIST_FILE: NO
